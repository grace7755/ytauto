# ytauto defaults. Override per project with:  ytauto run script.txt --config my.yaml
# Any key from ytauto/config.py Settings may be set here.

gemini_model: gemini-3-flash-preview
gemini_plan_model: gemini-3-flash-preview

width: 1920
height: 1080
fps: 30
crf: 18
crossfade: 0.0          # 0 = hard cuts; 0.3 gives soft cuts between transcript segments

shot_target: 4.5        # seconds per clip
shot_min: 3.0
shot_max: 6.0

min_source_height: 1080
screen_top_k: 4         # YouTube videos Gemini screens per shot
max_shots_per_source: 3 # variety: max clips taken from one source video
rounds_per_shot: 2      # fresh-query retries on YouTube before stock fallback

# ---- speed ------------------------------------------------------------------
# storyboard: judge the video's seek-bar preview sheet (~12 s, ~3k tokens per candidate)
# url:        the judge watches the whole YouTube video (~50 s, ~240k tokens per candidate)
screen_mode: storyboard_only   # storyboard, but skip videos without one instead of URL-watching them
screen_batch: 2         # storyboards per judge call (measured: usable agrees 15/16 with single screens)
prerank: rank           # local CLIP orders candidates before any judge call: off | rank | filter
prerank_margin: 0.04    # filter only: drop candidates this far below the best CLIP similarity
shot_workers: 2         # shots selected at the same time (3 ran out of memory once on 15 GB with Chrome open)
prefetch_ahead: 3        # shots prepared in the background (search, metadata, storyboards, CLIP); 0 = off
screen_workers: 3       # candidates screened at the same time within one shot
judge_concurrency: 4    # max AI-judge calls in flight at once (rate limits are the real ceiling)
judge_patience: 60      # seconds to wait for a judge link to recover before giving up a shot
stock_tries_per_provider: 3

min_score: 70           # benchmark pass mark (0-100)
min_relevance: 60       # hard floor on relevance sub-score
blur_threshold: 60
min_saturation: 0.06
max_face_ratio: 0.12

fallback_order: [pexels, pixabay, coverr, mixkit]

# ---- AI judge: ordered fallback chain -------------------------------------
# Walked top to bottom until one provider answers. `provider` is a key in the provider
# config at $HEART_CONFIG (read-only), or `_direct` = native google-genai + GEMINI_API_KEY.
#   vision:  can analyse frame grids (local clip verification)
#   youtube: can analyse a public YouTube URL without downloading it (pre-download screening)
# A link that fails is skipped for 5 minutes.
#   rpm / rpd: optional client-side caps (requests per minute / per day, see llm/quota.py). A link
#   at its rpd is skipped without being called; a daily-quota 429 marks it spent until midnight
#   Pacific (Gemini) or for an hour (others); a per-minute 429 only for its retry delay.
#   Leave rpd unset unless you know the real cap. `ytauto quota` shows today's use.
judge_chain:
  # Primary: your own GEMINI_API_KEY (.env), straight to Google - no proxy in between. It is a
  # free-tier key, and free quota is per project *per model*, so each model is its own link and
  # the chain moves on when one model's day is spent. Probed live 2026-10-29; the 2.5 models
  # answer 404 "no longer available to new users" on this key.
  - {provider: _direct,      model: "gemini-3.1-flash-lite",           vision: true, youtube: true, rpm: 15}
  - {provider: _direct,      model: "gemini-3.5-flash-lite",           vision: true, youtube: true, rpm: 15}
  - {provider: _direct,      model: "gemini-flash-lite-latest",        vision: true, youtube: true, rpm: 15}
  # Fallback: providers from $HEART_CONFIG (another project's file; read, never written).
  - {provider: geminiopenai, model: "models/gemini-2.5-flash-lite",   vision: true, youtube: true, rpm: 15}
  - {provider: geminiopenai, model: "models/gemini-flash-lite-latest", vision: true, youtube: true, rpm: 15}
  # Reasoning model: needs a far bigger budget or it is truncated before it answers at all.
  - {provider: zai,          model: "GLM-4.6V-Flash",                 vision: true, max_tokens: 8192}
  # Last: free tier allows only 20 requests/day on this model (from Google's own 429 message).
  - {provider: _direct,      model: "gemini-3-flash-preview",         vision: true, youtube: true, rpd: 20}
# Frame grid sent to vision models in place of video (3x2 tile @1.2fps = 6 frames).
grid_cols: 3
grid_rows: 2
grid_fps: 1.2
