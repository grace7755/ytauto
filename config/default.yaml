# ytauto defaults. Override per project with:  ytauto run script.txt --config my.yaml
# Any key from ytauto/config.py Settings may be set here.

gemini_model: gemini-3-flash-preview
gemini_plan_model: gemini-3-flash-preview

width: 1920
height: 1080
fps: 30
crf: 18
crossfade: 0.0          # 0 = hard cuts; 0.3 gives soft cuts between transcript segments

# No clip in the final video is longer than 5 s (shot_max). Measured on the Philippines script (42
# sentences, 340 s): 4.5/3/5 = 93 shots (a 5 s cap splits long sentences into more shots).
shot_target: 4.5        # seconds per clip (4-5)
shot_min: 3.0
shot_max: 5.0

min_source_height: 1080
screen_top_k: 4         # YouTube videos Gemini screens per shot
max_shots_per_source: 0 # clips taken from one YouTube video: 0 = no limit (different, non-overlapping sections only)
# Reusing a clip (the same footage in a second shot) is the last resort before a weak match: at most
# `reuse_max_uses` appearances in the whole video, `reuse_min_gap` seconds between any two of them, never in
# consecutive shots, and the clip is judged again against the new shot. 0 uses = never reuse
reuse_max_uses: 2
reuse_min_gap: 60
reuse_tries: 2          # earlier clips (best CLIP match first) judged for the new shot
rounds_per_shot: 2      # fresh-query retries on YouTube before stock fallback
max_downloads_per_shot: 8  # then stop downloading for the shot: stock, still, reuse, weak (Philippines: 14 shots took 8+, 10 of them ended weak). 0 = off
visual_ladder: true         # Round 6: photo-first for named products, attempt budget, category fallback. false = the exact old order
shot_attempts_budget: 12    # judged attempts per shot (YouTube + stock) before the photo / category / reuse steps. 0 = off
category_fallback: true     # nothing close found (best relevance < category_trigger_relevance): one search for the category, marked CATEGORY FALLBACK
category_trigger_relevance: 50
category_attempts: 4
graphics_enabled: false     # graphic shots stay footage shots until the Remotion cards exist

# ---- speed ------------------------------------------------------------------
# storyboard: judge the video's seek-bar preview sheet (~12 s, ~3k tokens per candidate)
# url:        the judge watches the whole YouTube video (~50 s, ~240k tokens per candidate)
screen_mode: storyboard_only   # storyboard, but skip videos without one instead of URL-watching them
screen_batch: 2         # storyboards per judge call (measured: usable agrees 15/16 with single screens)
prerank: rank           # local CLIP orders candidates before any judge call: off | rank | filter
prerank_margin: 0.04    # filter only: drop candidates this far below the best CLIP similarity
shot_workers: 2         # shots selected at the same time (3 ran out of memory once on 15 GB with Chrome open)
prefetch_ahead: 3        # shots prepared in the background (search, metadata, storyboards, CLIP); 0 = off
screen_workers: 3       # candidates screened at the same time within one shot
judge_concurrency: 4    # max AI-judge calls in flight at once (rate limits are the real ceiling)
judge_hedge_after: 8    # a judge call slower than this (or 2.5x its link's usual time) is also sent to the next link; first answer wins. 0 = off
download_ahead: true    # fetch the next screened candidate's section while the current clip is cut and judged
heart_concurrency: 4    # ChatGPT (HeartCode) processes at once; = judge_concurrency now that every call starts on Luna (was 2 when it was only an overflow lane)
defer_ai_check: true    # skip the extra AI-footage call on a clip already rejected on score (checked later only if it becomes a weak match)
judge_patience: 60      # seconds to wait for a judge link to recover before giving up a shot
stock_tries_per_provider: 3
stock_first: true       # shots the planner marks `generic` (open sea, aerial coast, crowds) try stock before YouTube

min_score: 70           # benchmark pass mark (0-100)
min_relevance: 60       # hard floor on relevance sub-score
# Laplacian variance on a 1080p frame. 60 rejected good underwater and drone footage: of the 18 Philippines clips
# rejected between 40 and 59, 9 were rated relevant (70-100) by the judge, "good quality, slightly soft". Below 40 the
# judge's own verdicts were wrong-subject or synthetic. The total-score gate (min_score) still guards quality.
blur_threshold: 40
min_saturation: 0.06
max_face_ratio: 0.12

fallback_order: [pexels, pixabay, coverr, mixkit]

# ---- last resorts ----------------------------------------------------------------
stills: true             # a licensed photograph with a slow move when no video fits (Pexels, Pixabay, Commons)
still_min_relevance: 75  # stricter than clips (min_relevance 60): a photo must show what the narration is about
still_order: [pexels, pixabay, commons]
still_min_width: 2000
still_tries: 3
photo_first_providers: [commons]  # photo-first shots (named products) search only these first: Pexels/Pixabay give generic photos the judge rejects
commons_gap: 1.0            # seconds between Wikimedia Commons requests (429 otherwise); a 429 pauses Commons for its Retry-After
contact: ""                 # an email or URL for the User-Agent Wikimedia asks for (optional, e.g. you@example.com)
watermark_crop: true     # a corner-logo-only clip (source tall enough) is re-cut 1.15x closer, then judged again
watermark_crop_zoom: 1.15

# ---- AI judge: ordered fallback chain -------------------------------------
# Walked top to bottom until one provider answers. `provider` is a key in the provider
# config at $HEART_CONFIG (read-only), or `_direct` = native google-genai + GEMINI_API_KEY.
#   vision:  can analyse frame grids (local clip verification)
#   youtube: can analyse a public YouTube URL without downloading it (pre-download screening)
# A link that fails is skipped for 5 minutes.
#   rpm / rpd: optional client-side caps (requests per minute / per day, see llm/quota.py). A link
#   at its rpd is skipped without being called; a daily-quota 429 marks it spent until midnight
#   Pacific (Gemini) or for an hour (others); a per-minute 429 only for its retry delay.
#   Leave rpd unset unless you know the real cap. `ytauto quota` shows today's use.
judge_chain:
  # ChatGPT first, for every task (planner, critic, screening, clip and photo verification, the AI-made check, review, film
  # facts): GPT Luna, then GPT Terra when Luna cannot give a valid answer (error, empty, cut off, broken JSON). Both go through
  # Nibedita's HeartCode CLI (llm/heart.py) on your ChatGPT plan, no API key, and SHARE ONE usage limit: when the reply says
  # "usage limit reached ... try again at 7:06 PM" both are paused until then (llm/limits.py) and the chain continues on Gemini.
  # GPT Sol is excluded (config.py refuses it). Measured 2026-10-30 on 126 labelled clips with Luna: caught 58/64
  # watermark/text clips, flagged 3/62 clean ones, 0 errors, median 6.5 s. Skipped automatically when `heart` is not installed.
  - {provider: _heart,       model: "chatgpt gpt-6-luna",              vision: true}
  # Terra: probed live 2026-11-01 (`heart -p -m "chatgpt gpt-6.1-terra"` answered). `gpt-6-terra` is rejected on a ChatGPT account.
  - {provider: _heart,       model: "chatgpt gpt-6.1-terra",          vision: true}
  # Gemini: your own GEMINI_API_KEY (.env), straight to Google. Free quota is per project *per model*, so each model is its own
  # link. Probed live 2026-10-29; the 2.5 models answer 404 "no longer available to new users" on this key.
  - {provider: _direct,      model: "gemini-3.1-flash-lite",           vision: true, youtube: true, rpm: 15}
  - {provider: _direct,      model: "gemini-3.5-flash-lite",           vision: true, youtube: true, rpm: 15}
  - {provider: _direct,      model: "gemini-flash-lite-latest",        vision: true, youtube: true, rpm: 15}
  # OPTIONAL, off by default: ChatGPT through OpenAI's Codex CLI (llm/codex.py), signed in with `codex login`. It draws from the
  # same ChatGPT plan limit as Luna and Terra, so it adds no capacity; only a second route if HeartCode breaks. Uncomment to enable:
  # - {provider: _codex,       model: "gpt-6.1-terra",                  vision: true}
  # Fallback: providers from $HEART_CONFIG (another project's file; read, never written).
  - {provider: geminiopenai, model: "models/gemini-2.5-flash-lite",   vision: true, youtube: true, rpm: 15}
  - {provider: geminiopenai, model: "models/gemini-flash-lite-latest", vision: true, youtube: true, rpm: 15}
  # Verified live 2026-10-29 on 6 known clips (right clip high, wrong clip low, watermark caught):
  # a second Google project behind the proxy (own quota), and a free vision model (slow, ~20 s).
  - {provider: geminiopenai, model: "models/gemini-3.1-flash-lite", vision: true, youtube: true, rpm: 15}
  - {provider: openrouter,   model: "nvidia/nemotron-3.5-super-vl:free", vision: true, max_tokens: 4096}
  # Reasoning model: needs a far bigger budget or it is truncated before it answers at all.
  - {provider: zai,          model: "GLM-4.6V-Flash",                 vision: true, max_tokens: 8192}
  # Last: free tier allows only 20 requests/day on this model (from Google's own 429 message).
  - {provider: _direct,      model: "gemini-3-flash-preview",         vision: true, youtube: true, rpd: 20}
# Calls always start at the top of the chain (Luna), then move down on failure. (2 = spread over the first two links.)
judge_lanes: 1
# Reasoning effort per task: low | medium | high. Empty = each tool's own default (Codex shows "medium"). Set from a measurement
# (scripts/measure_effort.py), e.g.  judge_effort: {aicheck: low, screen: low, plan: medium, review: medium}
judge_effort: {}
# Frame grid sent to vision models in place of video (3x2 tile @1.2fps = 6 frames).
grid_cols: 3
grid_rows: 2
grid_fps: 1.2
